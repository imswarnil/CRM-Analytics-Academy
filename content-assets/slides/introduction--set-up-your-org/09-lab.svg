<text x="320" y="290" font-family="'Schibsted Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="60" font-weight="900" fill="#0C1B33" letter-spacing="-1.5"><tspan x="320" dy="0">The username is not an email address</tspan></text>
<rect x="160" y="430" width="1600" height="78" fill="#DDEBFA" stroke="#0C1B33" stroke-width="2"/>
<text x="190" y="480" font-family="'IBM Plex Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="27" font-weight="400" fill="#0C1B33" letter-spacing="0"><tspan x="190" dy="0">The signup form → Username field</tspan></text>
<text x="164" y="600" font-family="'Schibsted Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="400" fill="#4A5B78" letter-spacing="0"><tspan x="164" dy="0">Use a real email address for Email, because you need the activation link. The Username field</tspan><tspan x="164" dy="45.44">is separate and it must be globally unique across every Salesforce org on earth, so put</tspan><tspan x="164" dy="45.44">something like your-name-crma-2026 at example dot com in it. It never has to receive mail.</tspan><tspan x="164" dy="45.44">People reuse their email address here, hit a uniqueness…</tspan></text>
<rect x="160" y="840" width="790" height="62" fill="#FAFCFE" stroke="#2F5BEA" stroke-width="2" stroke-dasharray="8 6"/>
