<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <defs>
    <pattern id="min" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#2F5BEA" stroke-opacity=".05" stroke-width="1"/></pattern>
    <pattern id="maj" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#2F5BEA" stroke-opacity=".11" stroke-width="1.5"/></pattern>
    <pattern id="tick" width="16" height="22" patternUnits="userSpaceOnUse"><path d="M0.75 0V10" stroke="#0C1B33" stroke-opacity=".5" stroke-width="1.5"/></pattern>
    <pattern id="tickL" width="80" height="22" patternUnits="userSpaceOnUse"><path d="M0.75 0V22" stroke="#0C1B33" stroke-opacity=".6" stroke-width="1.5"/></pattern>
    <pattern id="nmin" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#2F5BEA" stroke-opacity=".06"/></pattern>
    <pattern id="nmaj" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#2F5BEA" stroke-opacity=".12" stroke-width="1.5"/></pattern>
  </defs>
  <!-- TV-only area: navy graph paper -->
  <rect width="2560" height="1440" fill="#DDEBFA"/>
  <rect width="2560" height="1440" fill="url(#nmin)"/>
  <rect width="2560" height="1440" fill="url(#nmaj)"/>
  <!-- the visible strip on desktop (y 508–932): paper graph sheet -->
  <rect x="0" y="480" width="2560" height="480" fill="#FBFCFE"/>
  <rect x="0" y="480" width="2560" height="480" fill="url(#min)"/>
  <rect x="0" y="480" width="2560" height="480" fill="url(#maj)"/>
  <line x1="0" y1="480" x2="2560" y2="480" stroke="#0C1B33" stroke-width="4"/>
  <line x1="0" y1="960" x2="2560" y2="960" stroke="#0C1B33" stroke-width="4"/>
  <!-- rulers -->
  <rect x="0" y="482" width="2560" height="22" fill="url(#tick)"/>
  <rect x="0" y="482" width="2560" height="22" fill="url(#tickL)"/>
  <rect x="0" y="936" width="2560" height="22" fill="url(#tick)" transform="rotate(180 1280 947)"/>
  <rect x="0" y="936" width="2560" height="22" fill="url(#tickL)" transform="rotate(180 1280 947)"/>

  <!-- copy (safe area x 507–2053, y 508–932) -->
  <g font-family="IBM Plex Mono" font-weight="500" font-size="26" letter-spacing="3.6" fill="#2F5BEA">
    <text x="560" y="600">SHEET 01 / CRM ANALYTICS ACADEMY</text>
  </g>
  <g font-family="Schibsted Grotesk" font-weight="900" font-size="68" letter-spacing="-2.7" fill="#0C1B33">
