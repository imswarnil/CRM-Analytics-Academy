  </g>

  <!-- TV-only large lettering -->
  <g font-family="IBM Plex Mono" font-weight="500" font-size="30" letter-spacing="4" fill="#2F5BEA">
    <text x="160" y="200">SHEET 01 / CRM ANALYTICS ACADEMY</text>
    <text x="2400" y="1290" text-anchor="end">FREE · OPEN SOURCE · 12 LANGUAGES</text>
