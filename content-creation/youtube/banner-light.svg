    <text x="556" y="772">the way it’s used <tspan fill="#2F5BEA">at work.</tspan></text>
  </g>
  <g font-family="IBM Plex Mono" font-size="24" letter-spacing="2.4" fill="#4A5B78">
    <text x="560" y="872">RECIPES · SAQL · DASHBOARDS · SECURITY · EINSTEIN DISCOVERY</text>
  </g>

  <!-- figure: framed chart with hard shadow + crosshairs -->
  <g transform="translate(1690 560)">
    <rect x="14" y="14" width="340" height="300" fill="#0C1B33"/>
    <rect x="0" y="0" width="340" height="300" fill="#FBFCFE" stroke="#0C1B33" stroke-width="4"/>
    <g font-family="IBM Plex Mono" font-weight="500" font-size="16" letter-spacing="2" fill="#2F5BEA"><text x="24" y="40">FIG. 01 — PIPELINE</text></g>
    <rect x="44" y="196" width="56" height="64" fill="#A8CCF2"/>
    <rect x="120" y="156" width="56" height="104" fill="#3D8BD9"/>
    <rect x="196" y="110" width="56" height="150" fill="#2F5BEA"/>
    <rect x="272" y="74" width="40" height="186" fill="#0F2A5C"/>
    <path d="M28 260H316" stroke="#0C1B33" stroke-width="4"/>
    <path d="M72 186L148 146L224 100L292 64" fill="none" stroke="#3FC6DC" stroke-width="4" stroke-dasharray="10 8"/>
    <g stroke="#0C1B33" stroke-width="3"><path d="M0 -16V16M-16 0H16"/><path d="M340 -16V16M324 0H356"/><path d="M0 284V316M-16 300H16"/><path d="M340 284V316M324 300H356"/></g>
  </g>
  <g font-family="IBM Plex Mono" font-size="20" letter-spacing="2" fill="#4A5B78">
