<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#032D60">
<title>Offline · CRM Analytics Academy</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root { --paper:#F4F6F8; --card:#FFFFFF; --ink:#181818; --ink2:#5C5A57; --line:#DDDBDA; --signal:#0176D3; }
  @media (prefers-color-scheme: dark) { :root { --paper:#02080F; --card:#081A30; --ink:#EAF2FB; --ink2:#7FA0C2; --line:rgba(124,190,255,.16); --signal:#1B96FF; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: grid; place-items: center; padding: 16px; background: var(--paper); color: var(--ink); font: 17px/1.6 Figtree, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
  main { max-width: 520px; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 32px; }
  .mark { display: flex; align-items: flex-end; gap: 4px; width: 34px; height: 34px; }
  .mark i { flex: 1; border-radius: 2px; display: block; }
  .eyebrow { font: 700 12px/1 inherit; letter-spacing: .09em; text-transform: uppercase; color: var(--signal); margin: 24px 0 8px; }
  h1 { font-size: clamp(28px, 6vw, 38px); line-height: 1.1; letter-spacing: -.02em; margin: 0 0 12px; }
  p { color: var(--ink2); margin: 0 0 24px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  a, button { font: 600 15px/1 inherit; border-radius: 4px; padding: 12px 18px; cursor: pointer; text-decoration: none; }
  button { background: var(--signal); color: #fff; border: 0; }
  a { color: var(--signal); border: 1px solid var(--line); }
</style>
</head>
<body>
<main>
  <span class="mark" aria-hidden="true"><i style="height:42%;background:#7CBEFF"></i><i style="height:70%;background:#1B96FF"></i><i style="height:100%;background:#0176D3"></i></span>
  <p class="eyebrow">You are offline</p>
  <h1>This page is not saved on your device yet.</h1>
  <p>The course page, the practice exam and every lesson you have opened are available offline. Reconnect to load this one.</p>
  <div class="row">
    <button type="button" onclick="location.reload()">Try again</button>
    <a href="/start">Open the course</a>
  </div>
</main>
</body>
</html>
