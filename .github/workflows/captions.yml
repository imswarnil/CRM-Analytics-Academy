name: Refresh captions from Mux

# Each lesson has ONE video; its English captions are generated by Mux and can
# be corrected in the Mux dashboard. This keeps content-transcripts/en/ in step
# with Mux, so a corrected caption is re-translated (translate.yml) and
# re-published (deploy) without anyone touching the repo.
#
# Read-only against Mux. Needs repository secrets MUX_TOKEN_ID and
# MUX_TOKEN_SECRET (a read-only access token is enough), plus
# MUX_SIGNING_KEY_ID / MUX_SIGNING_KEY_SECRET to read a signed (Pro) video's
# captions. Without them the job skips with a warning.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      route:
        description: 'One lesson route (e.g. /saql/functions); blank = every lesson with a video'
        type: string
        default: ''

permissions:
  contents: write
  # To start the translation run after committing (see the last step).
  actions: write

concurrency:
  group: captions
  cancel-in-progress: false

jobs:
  captions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check Mux credentials
        id: cfg
        env:
          MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID }}
        run: |
          if [ -z "$MUX_TOKEN_ID" ]; then
            echo "::warning::MUX_TOKEN_ID / MUX_TOKEN_SECRET secrets are not set — skipping the caption sync."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync English captions
        if: steps.cfg.outputs.configured == 'true'
        env:
          MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID }}
          MUX_TOKEN_SECRET: ${{ secrets.MUX_TOKEN_SECRET }}
          MUX_SIGNING_KEY_ID: ${{ secrets.MUX_SIGNING_KEY_ID }}
          MUX_SIGNING_KEY_SECRET: ${{ secrets.MUX_SIGNING_KEY_SECRET }}
        run: |
          if [ -n "${{ inputs.route }}" ]; then
            node scripts/video/captions.mjs "${{ inputs.route }}"
          else
            node scripts/video/captions.mjs --all
          fi

      - name: Commit
        if: steps.cfg.outputs.configured == 'true'
        run: |
          [ -d content-transcripts ] || exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content-transcripts
          if git diff --cached --quiet; then
            echo "Captions unchanged."
            exit 0
          fi
          git commit -m "Refresh lesson captions from Mux"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_ENV"

      # A push made with GITHUB_TOKEN triggers no other workflow, so the
      # translation (which then dispatches the deploy) is started explicitly.
      - name: Translate the new captions
        if: steps.cfg.outputs.configured == 'true' && env.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Translate content" --ref main
