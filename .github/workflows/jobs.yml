name: Jobs feed (daily)

# Fetches CRM Analytics jobs from public job APIs (scripts/jobs/fetch.mjs),
# commits public/jobs.json when it changed, then starts the deploy so the
# site serves the new file. A push made with GITHUB_TOKEN does not trigger
# other workflows, so the deploy is started explicitly (workflow_dispatch is
# the allowed exception).
on:
  schedule:
    - cron: '30 3 * * *'   # 03:30 UTC = 09:00 IST
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: jobs-feed
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch jobs
        run: node scripts/jobs/fetch.mjs
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SERPAPI_DAILY: ${{ vars.SERPAPI_DAILY }}
      - name: Commit and deploy if the feed changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/jobs.json; then echo "No new jobs."; exit 0; fi
          git config user.name "jobs-feed"
          git config user.email "jobs-feed@users.noreply.github.com"
          git add public/jobs.json
          git commit -m "Jobs feed: $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run deploy-cloudflare.yml --ref main -f indexnow=false
